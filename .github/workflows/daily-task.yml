name: 🎮 Daily Task (Gemini API免费方案)

on:
  repository_dispatch:
    types: [daily-task]
  workflow_dispatch:
  schedule:
    # 全部安排在北京时间 23:30 以后的深夜非高峰期，间隔1小时
    # UTC 时间，对应北京时间: 23:37 / 00:37 / 01:37 / 02:37 / 03:37
    - cron: '37 15,16,17,18,19 * * *'

concurrency:
  group: daily-task-run
  cancel-in-progress: true

jobs:
  run-task:
    name: 🎮 Daily Task
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 依赖缓存：pip 包 + Playwright 浏览器，命中缓存只需 ~20 秒 ──
      - name: 3. 缓存 pip 包
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-v1-${{ runner.os }}-${{ hashFiles('.github/workflows/daily-task.yml') }}
          restore-keys: pip-v1-${{ runner.os }}-

      - name: 4. 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-v1-${{ runner.os }}-chromium
          restore-keys: pw-v1-${{ runner.os }}-

      - name: 5. 安装依赖（有缓存时秒过）
        run: |
          python -m pip install --upgrade pip
          pip install -U playwright requests pyyaml 'hcaptcha-challenger>=0.19'
          python -m playwright install chromium --with-deps
          echo "✅ Python 依赖完成"

      - name: 6. 安装 Sing-Box（代理转换）
        env:
          PROXY_STR: ${{ secrets.TASK_PROXY_STR }}
        run: |
          if [ -n "$PROXY_STR" ]; then
            curl -sL https://github.com/SagerNet/sing-box/releases/download/v1.9.3/sing-box-1.9.3-linux-amd64.tar.gz -o sb.tgz
            tar -xzf sb.tgz
            sudo cp sing-box-1.9.3-linux-amd64/sing-box /usr/local/bin/
            echo "✅ Sing-Box 就绪"
          else
            echo "ℹ️ 未配置代理，跳过"
          fi

      # ── 执行任务：CF 真人验证时自动换下一个节点，最多尝试全部节点 ──
      # 脚本返回码：0=成功，1=普通失败，2=CF 真人验证，触发换节点
      - name: 7. 执行任务
        env:
          ACCOUNTS:       ${{ secrets.TASK_ACCOUNTS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROXY_STR:      ${{ secrets.TASK_PROXY_STR }}
          TASK_LOGIN_URL:    ${{ secrets.TASK_LOGIN_URL }}
          TASK_PROJECTS_URL: ${{ secrets.TASK_PROJECTS_URL }}
          TG_BOT_TOKEN:   ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:     ${{ secrets.TG_CHAT_ID }}
        run: |
          set +e
          # 用 grep -c . 数非空行，避免 wc -l 因末尾无换行而少算
          NODE_COUNT=$(printf '%s\n' "$PROXY_STR" | tr ',' '\n' | grep -c .)
          [ "$NODE_COUNT" -lt 1 ] && NODE_COUNT=1
          RESULT=1
          for ((i=0; i<NODE_COUNT; i++)); do
            echo "▶️ 尝试代理节点索引: $i / $NODE_COUNT"
            PROXY_INDEX=$i python daily_task.py
            RESULT=$?
            echo "  ↳ 退出码: $RESULT"
            if [ "$RESULT" -eq 0 ]; then
              echo "✅ 任务成功"
              exit 0
            elif [ "$RESULT" -eq 2 ]; then
              echo "⚠️ 当前节点触发 Cloudflare 真人验证，切换下一个节点"
              continue
            else
              echo "❌ 任务失败（退出码 $RESULT），停止重试"
              exit "$RESULT"
            fi
          done
          echo "❌ 所有 $NODE_COUNT 个代理节点均触发 Cloudflare 或失败"
          exit "$RESULT"

      - name: 8. 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 3
